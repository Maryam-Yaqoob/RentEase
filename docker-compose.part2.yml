services:

  db:
    image: postgres:15
    container_name: rentease_db_p2
    environment:
      POSTGRES_DB: rentease
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_p2:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  backend:
    image: python:3.11-slim
    container_name: rentease_backend_p2
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rentease
      SECRET_KEY: supersecretkey123
      CORS_ORIGINS: '["*"]'
    ports:
      - "8001:8000"
    depends_on:
      - db
    command: >
      sh -c "pip install -r requirements.txt &&
      uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: rentease_frontend_p2
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5174:5173"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

volumes:
  postgres_data_p2:
    driver: local

