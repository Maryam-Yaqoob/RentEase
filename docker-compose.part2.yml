services:
  db:
    image: postgres:15
    container_name: rentease_db_p2
    environment:
      POSTGRES_DB: rentease
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_p2:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - rentease_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: python:3.11-slim
    container_name: rentease_backend_p2
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/__pycache__
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rentease
      SECRET_KEY: supersecretkey123
      CORS_ORIGINS: '["*"]'
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped
    networks:
      - rentease_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: node:20-alpine
    container_name: rentease_frontend_p2
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8001
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    networks:
      - rentease_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data_p2:
    driver: local

networks:
  rentease_network:
    driver: bridge
